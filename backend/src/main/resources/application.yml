spring:
  application:
    name: ingestion
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 0
  datasource:
    hikari:
      maximum-pool-size: 6
  flyway:
    enabled: true

app:
  ingestion:
    batch-size: ${APP_INGESTION_BATCH_SIZE:5000}
    commit-every-n-batches: ${APP_INGESTION_COMMIT_EVERY_N_BATCHES:2}
    synchronous-commit: ${APP_INGESTION_SYNCHRONOUS_COMMIT:false}
    upload-dir: ${APP_INGESTION_UPLOAD_DIR:/data/uploads}
    max-error-samples: 20
    max-error-raw-length: 500
    executor:
      core-size: 1
      max-size: 2
      queue-capacity: 10
    max-in-flight: 12

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
